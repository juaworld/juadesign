<style>
:root{
  --brand:#E31E24; --brand-ink:#C3161C; --brand-soft:#FDECEC;
  --bg:#F5F4F2; --surface:#FFFFFF; --surface-2:#FAF9F7;
  --line:#E6E2DD; --line-2:#D6D1CA;
  --ink:#1E1D1B; --ink-2:#4A4743; --ink-3:#7A766F;
  --ok:#2F7D4F; --warn:#C77700; --info:#1F5FBF;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(30,29,27,.04),0 4px 16px rgba(30,29,27,.05);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.hd-in{max-width:1180px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.brand img{height:34px;width:auto;display:block}
.brand .bt{font-weight:700;font-size:15px;letter-spacing:-.01em;padding-left:12px;border-left:1px solid var(--line-2);color:var(--ink-2)}
.nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;padding:8px 12px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--ink);color:#fff}
.nav a .cnt{font-size:11px;margin-left:4px;opacity:.7}
.hd-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.admin-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);padding:5px 10px;border-radius:999px;border:0}
.admin-pill.preview{color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line)}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 22px;flex-wrap:wrap}
.page-h h1{font-size:26px;letter-spacing:-.02em;margin:0;line-height:1.3}
.page-h p{margin:6px 0 0;color:var(--ink-3);font-size:14.5px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-b{padding:20px 22px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.sp{flex:1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}

/* ---------- buttons/forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;line-height:1.3;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--brand-ink);border-color:#F1C4C5}
.btn[disabled]{opacity:.5;cursor:default}
.ico{width:16px;height:16px;flex-shrink:0}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 6px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:var(--radius-sm);padding:9px 12px;font-size:14.5px;line-height:1.5}
textarea.in{min-height:96px;resize:vertical}
textarea.in.code{font-family:var(--mono);font-size:13px;min-height:180px}
.in:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(30,29,27,.08)}
.fg{margin-bottom:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--brand)}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:5px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 9px 3px 8px;border-radius:999px;white-space:nowrap;line-height:1.4;background:color-mix(in srgb,var(--c) 11%,#fff);color:color-mix(in srgb,var(--c) 88%,#000)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.badge.flat::before{display:none}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.red{background:var(--brand-soft);border-color:#F6CACB;color:var(--brand-ink)}
.idc{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.chip{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--line-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{font-size:11.5px;opacity:.65;font-weight:600}

/* ---------- rich text ---------- */
.rt{font-size:14.5px;color:var(--ink)}
.rt p{margin:0 0 10px}
.rt p:last-child,.rt ul:last-child,.rt .tbl:last-child,.rt .callout:last-child{margin-bottom:0}
.rt ul{margin:0 0 10px;padding-left:1.2em}
.rt li{margin:2px 0}
.rt li::marker{color:var(--ink-3)}
.rt h4{font-size:15px;margin:18px 0 8px;letter-spacing:-.01em}
.rt h4:first-child{margin-top:0}
.rt strong{font-weight:700}
.tbl{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:var(--radius-sm);-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:480px}
.tbl th,.tbl td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:700;color:var(--ink-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.callout{background:var(--surface-2);border-left:3px solid var(--line-2);padding:10px 14px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:0 0 12px;font-size:14px;color:var(--ink-2)}

/* ---------- home ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 32px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--brand-soft);opacity:.7}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:30px;letter-spacing:-.025em;margin:0 0 10px;line-height:1.3}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{margin:0;color:var(--ink-2);max-width:640px}
.hero .row{margin-top:20px}
.search-big{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:4px 4px 4px 16px;max-width:560px;margin-top:20px}
.search-big input{border:0;outline:none;flex:1;min-width:0;padding:8px 0;font-size:15px;background:transparent}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.legend .lg{padding:16px 18px;text-decoration:none;display:block;transition:border-color .15s}
.legend .lg:hover{border-color:var(--line-2)}
.lg .num{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.lg .d{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:34px 0 12px}
.sec-t h2{font-size:18px;margin:0;letter-spacing:-.015em}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cat-card{padding:18px 20px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.cat-card:hover{border-color:var(--line-2)}
.cat-card .t{font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.cat-card .d{font-size:13px;color:var(--ink-3)}
.mini-bar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin-top:6px}
.mini-bar span{display:block;height:100%}
.notice{padding:18px 22px;border-left:4px solid var(--brand)}
.notice .t{font-weight:800;font-size:16px;margin:2px 0 6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

/* ---------- rules ---------- */
.rules-l{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.side a{text-decoration:none;padding:8px 12px;border-radius:var(--radius-sm);font-size:14.5px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.side a:hover{background:var(--surface)}
.side a.on{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--brand)}
.side a .n{color:var(--ink-3);font-weight:500;font-size:13px}
.side .lbl{font-size:12px;font-weight:700;color:var(--ink-3);padding:6px 12px;letter-spacing:.04em}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:0 12px;flex:1;min-width:200px}
.searchbox input{border:0;outline:none;flex:1;min-width:0;padding:9px 0;background:transparent;font-size:14.5px}
.cat-h{margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cat-h:first-child{margin-top:0}
.cat-h h2{font-size:19px;margin:0;letter-spacing:-.015em}
.cat-h .d{font-size:13px;color:var(--ink-3)}
.rule{padding:18px 22px;scroll-margin-top:84px}
.rule-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.rule-h .tt{flex:1;min-width:0}
.rule-h h3{font-size:16.5px;margin:2px 0 0;letter-spacing:-.01em;line-height:1.4}
.rule .note{margin-top:12px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13.5px;background:color-mix(in srgb,var(--c) 7%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,#fff);color:var(--ink-2)}
.rule .note b{color:color-mix(in srgb,var(--c) 85%,#000)}
.admin-note{margin-top:10px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;background:#FFF8E1;border:1px dashed #E8C766;color:#6B5310}
.rule-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink-3)}
.rel{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);text-decoration:none;color:var(--ink-2)}
a.rel:hover{border-color:var(--line-2)}
.cat-banner{padding:12px 16px;margin-bottom:12px;font-size:13.5px;color:var(--ink-2)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}

/* ---------- tasks ---------- */
.task{padding:0;overflow:hidden}
.task-h{padding:18px 22px;display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.task-h:hover{background:var(--surface-2)}
.prio{width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;color:var(--ink-2)}
.prio.p1,.prio.p2,.prio.p3{background:var(--brand-soft);border-color:#F6CACB;color:var(--brand-ink)}
.task-h .tt{flex:1;min-width:0}
.task-h h3{font-size:16.5px;margin:2px 0 4px;letter-spacing:-.01em;line-height:1.4}
.task-h .sum{font-size:14px;color:var(--ink-2)}
.task-b{padding:4px 22px 22px;border-top:1px solid var(--line)}
.steps{display:flex;gap:4px;margin:16px 0 18px}
.steps .s{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--ink-3)}
.steps .s i{display:block;height:5px;border-radius:999px;background:var(--line);margin-bottom:6px}
.steps .s.on{color:var(--ink)}
.steps .s.on i{background:var(--brand)}
.steps .s.cur{color:var(--brand-ink)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13.5px;margin:0 0 16px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}
.chev{transition:transform .2s;color:var(--ink-3);margin-top:6px}
.open .chev{transform:rotate(180deg)}

/* ---------- suggestions ---------- */
.sug-l{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
.sug-form{position:sticky;top:84px}
.sug{padding:18px 20px}
.sug-h{display:flex;gap:10px;align-items:flex-start}
.sug-h h3{font-size:16px;margin:0;flex:1;min-width:0;line-height:1.45}
.sug-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin:6px 0 10px}
.sug-body{font-size:14.5px;white-space:pre-wrap;color:var(--ink-2)}
.sug-body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.answer{margin-top:14px;padding:12px 16px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line)}
.answer .who{font-size:12.5px;font-weight:700;color:var(--brand-ink);margin-bottom:4px;display:flex;gap:8px}
.answer .txt{font-size:14px;white-space:pre-wrap}
.sug-f{display:flex;align-items:center;gap:8px;margin-top:12px}
.like{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.like.on{border-color:#F6CACB;background:var(--brand-soft);color:var(--brand-ink)}
.adm-box{margin-top:14px;padding:14px;border-radius:var(--radius-sm);background:#FFFBF0;border:1px dashed #E8C766}
.receipt{padding:14px 16px;background:#F0F7F2;border:1px solid #CFE6D7;border-radius:var(--radius-sm);font-size:13.5px;margin-top:12px}

/* ---------- history ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:0 0 18px}
.tl .it::before{content:"";position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line-2)}
.tl .it:first-child::before{border-color:var(--brand);background:var(--brand-soft)}
.tl .at{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- docs ---------- */
.docs-l{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(20,19,18,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{max-width:420px}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:17px;flex:1}
.modal-b{padding:20px 22px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 16px 16px;flex-wrap:wrap}
.modal-f .l{margin-right:auto}

/* ---------- gate / toast / footer ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .card{max-width:400px;width:100%;padding:34px 30px;text-align:center}
.gate img{height:46px;margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast.err{background:var(--brand-ink)}
.ft{border-top:1px solid var(--line);margin-top:40px}
.ft-in{max-width:1180px;margin:0 auto;padding:22px 20px 40px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.ft-in img{height:22px;opacity:.85}
.ft-in button{border:0;background:none;color:var(--ink-3);text-decoration:underline;padding:0;font-size:12.5px}
.skel{background:linear-gradient(90deg,#eeece9 25%,#f6f5f3 50%,#eeece9 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--radius)}
@keyframes sk{to{background-position:-200% 0}}
.adm-bar{background:#1E1D1B;color:#fff;font-size:13px}
.adm-in{max-width:1180px;margin:0 auto;padding:7px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.adm-bar button{background:rgba(255,255,255,.12);border:0;color:#fff;padding:4px 10px;border-radius:6px;font-size:12.5px;font-weight:600}
.adm-bar button:hover{background:rgba(255,255,255,.2)}
.warn-bar{background:#FFF4E5;border:1px solid #F3D3A4;color:#7A4A00;padding:12px 16px;border-radius:var(--radius-sm);font-size:14px;margin-bottom:18px}

@media (max-width:900px){
  .rules-l,.sug-l,.docs-l{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:minmax(0,1fr)}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side .lbl{display:none}
  .side a{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px}
  .side a.on{box-shadow:none;background:var(--ink);color:#fff;border-color:var(--ink)}
  .side a.on .n{color:#fff;opacity:.7}
  .sug-form{position:static}
  .two{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:14.5px}
  .hd-in{height:auto;flex-wrap:wrap;padding:10px 16px 0;gap:8px}
  .brand img{height:28px}
  .brand .bt{font-size:14px}
  .nav{order:3;flex-basis:100%;padding-bottom:8px;margin:0 -4px}
  .nav a{padding:7px 11px;font-size:14px}
  .wrap{padding:20px 16px 60px}
  .hero{padding:24px 20px}
  .hero h1{font-size:24px}
  .page-h h1{font-size:22px}
  .rule,.card-b{padding:16px}
  .task-h{padding:16px}
  .task-b{padding:4px 16px 18px}
  .f2,.f3{grid-template-columns:1fr}
  .steps .s{font-size:10.5px}
  .mask{padding:0;align-items:stretch}
  .modal{border-radius:0;min-height:100%}
  .modal-f{border-radius:0;position:sticky;bottom:0}
  .legend{grid-template-columns:1fr 1fr}
  .lg .num{font-size:24px}
}
@media print{.hd,.ft,.adm-bar,.btn,.toolbar,.side{display:none!important}body{background:#fff}.card{box-shadow:none}}

/* ---------- PC 전용: 문서형 2단 규정 카드 ---------- */
@media (min-width:1100px){
  .hd-in,.wrap,.adm-in,.ft-in{max-width:1320px}
  .wrap{padding:36px 32px 90px}
  .rules-l{grid-template-columns:240px minmax(0,1fr);gap:36px}
  .rule{display:grid;grid-template-columns:250px minmax(0,1fr);column-gap:32px;padding:22px 26px}
  .rule>.rule-h{grid-column:1;grid-row:1 / span 6;flex-direction:column;align-items:flex-start;gap:10px;margin:0;padding-right:20px;border-right:1px solid var(--line);align-self:stretch}
  .rule>.rule-h .tt{flex:0 0 auto}
  .hd-in,.adm-in,.ft-in{padding-left:32px;padding-right:32px}
  .rule>.rule-h h3{font-size:17px}
  .rule>*:not(.rule-h){grid-column:2}
  .rule>.rt{padding-top:2px}
  .hero{padding:44px 48px 40px}
  .hero h1{font-size:36px}
  .legend{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .sug-l{grid-template-columns:420px minmax(0,1fr)}
}

</style>

/* ===== 유틸 ===== */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function adminView() { return S.isAdmin && !S.preview; }
function byKey(list, key) { return (list || []).filter(function (x) { return x.key === key; })[0]; }
function st(group, key) { return byKey((S.db.statuses || {})[group], key) || { key: key, label: key || '-', color: '#888', desc: '' }; }
function badge(group, key, extra) { var s = st(group, key); return '<span class="badge ' + (extra || '') + '" style="--c:' + esc(s.color) + '" title="' + esc(s.desc) + '">' + esc(s.label) + '</span>'; }
function catName(id) { var c = (S.db.categories || []).filter(function (c) { return c.id === id; })[0]; return c ? c.name : id; }
function fmtDate(s) { if (!s) return ''; s = String(s); return s.slice(0, 10).replace(/-/g, '.') + (s.length > 11 ? ' ' + s.slice(11, 16) : ''); }

/* 간단 서식: 빈 줄 문단 · '- ' 목록 · '| a | b |' 표 · '> ' 안내 · '### ' 소제목 · **굵게** */
function rich(text) {
  if (!text) return '';
  var lines = String(text).replace(/\r\n/g, '\n').split('\n');
  var out = [], i = 0;
  function inl(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  while (i < lines.length) {
    var ln = lines[i];
    if (!ln.trim()) { i++; continue; }
    if (/^\s*\|/.test(ln)) {
      var rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        var cells = lines[i].trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
        if (!cells.every(function (c) { return /^:?-{2,}:?$/.test(c); })) rows.push(cells);
        i++;
      }
      var h = '<div class="tbl"><table><thead><tr>' + rows[0].map(function (c) { return '<th>' + inl(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.slice(1).forEach(function (r) { h += '<tr>' + r.map(function (c) { var num = /^[\d,.\s~%+\-]+(원|만원|억원)?$/.test(c) && /\d/.test(c); return '<td' + (num ? ' class="num"' : '') + '>' + inl(c) + '</td>'; }).join('') + '</tr>'; });
      out.push(h + '</tbody></table></div>');
      continue;
    }
    if (/^\s*[-•]\s+/.test(ln)) {
      var li = [];
      while (i < lines.length && /^\s*[-•]\s+/.test(lines[i])) { li.push('<li>' + inl(lines[i].replace(/^\s*[-•]\s+/, '')) + '</li>'); i++; }
      out.push('<ul>' + li.join('') + '</ul>');
      continue;
    }
    if (/^\s*>\s?/.test(ln)) {
      var q = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(inl(lines[i].replace(/^\s*>\s?/, ''))); i++; }
      out.push('<div class="callout">' + q.join('<br>') + '</div>');
      continue;
    }
    if (/^###\s+/.test(ln)) { out.push('<h4>' + inl(ln.replace(/^###\s+/, '')) + '</h4>'); i++; continue; }
    var p = [];
    while (i < lines.length && lines[i].trim() && !/^\s*(\||[-•]\s|>|###\s)/.test(lines[i])) { p.push(inl(lines[i])); i++; }
    out.push('<p>' + p.join('<br>') + '</p>');
  }
  return '<div class="rt">' + out.join('') + '</div>';
}
function plain(t) { return String(t || '').replace(/[|*>#]/g, ' ').replace(/\s+/g, ' ').trim(); }

function toast(msg, err) {
  var t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, err ? 4200 : 2600);
}

/* ===== API ===== */
function api(action, payload) {
  if (!API_URL) return Promise.reject(new Error('NO_API'));
  var body = Object.assign({ action: action, code: S.code, token: S.token }, payload || {});
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok && res.code === 'NEED_CODE') { S.needCode = true; render(); throw new Error(res.error); }
      if (!res.ok && res.code === 'AUTH') { setToken(''); S.isAdmin = false; render(); }
      return res;
    });
}
function setToken(t) { S.token = t; if (t) LS.set('hb_token', t); else LS.del('hb_token'); }

function load() {
  S.loading = true; render();
  return api('load').then(function (res) {
    S.loading = false;
    if (!res.ok) { S.err = res.error || '불러오지 못했습니다.'; render(); return; }
    S.needCode = false; S.db = res.db; S.history = res.history || []; S.isAdmin = !!res.isAdmin;
    if (!S.isAdmin && S.token) setToken('');
    render();
  }).catch(function (e) {
    S.loading = false;
    if (S.needCode) return;
    S.err = e.message === 'NO_API' ? 'NO_API' : '서버에 연결하지 못했습니다. 잠시 후 새로고침해 주세요.';
    render();
  });
}

/* 관리자 저장: 변경 메모를 개정이력에 남김 */
function saveDb(note, publicNote) {
  var base = S.db.meta && S.db.meta.updatedAt;
  var snapshot = clone(S.db);
  return api('saveDb', { db: snapshot, note: note, publicNote: publicNote !== false, baseUpdatedAt: base }).then(function (res) {
    if (!res.ok) { toast(res.error || '저장 실패', true); throw new Error(res.error); }
    S.db.meta.updatedAt = res.updatedAt;
    S.history.push({ at: res.updatedAt, note: note, by: 'admin', public: publicNote !== false });
    toast('저장했습니다');
    return res;
  });
}

/* ===== 라우팅 ===== */
function route() {
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('?'), path = parts[0] || 'home', q = {};
  (parts[1] || '').split('&').forEach(function (kv) { if (!kv) return; var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
  return { path: path, q: q };
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
window.addEventListener('hashchange', function () { if (route().path === 'settings') S.settings = null; if (route().path === 'suggest' && Array.isArray(S.sugs)) S.sugs = null; render(); window.scrollTo(0, 0); });

/* ===== 렌더 ===== */
function render() {

  if (S.db && ((S.db.docs || []).length || adminView())) navs.push(['docs', adminView() ? '검토자료' : '참고자료']);

    hd += '<div class="adm-bar"><div class="adm-in"><b>관리자 모드</b><span style="opacity:.75">' + (S.preview ? '직원 화면 미리보기 중' : '편집 버튼으로 모든 내용을 수정할 수 있습니다') + '</span><span class="sp"></span>' +
      '<button data-act="preview">' + (S.preview ? '편집 화면으로' : '직원 화면 미리보기') + '</button><button data-act="logout">로그아웃</button></div></div>';
  }
  hd += '<header class="hd"><div class="hd-in"><a class="brand" href="#/home" aria-label="한백건축 사내규정 홈"><img src="' + window.HB_LOGO + '" alt="한백 Architects &amp; Engineers"><span class="bt">사내규정</span></a>' +
    '<nav class="nav" aria-label="주 메뉴">' + navs.map(function (n) { return '<a href="#/' + n[0] + '" class="' + (r.path === n[0] ? 'on' : '') + '">' + n[1] + '</a>'; }).join('') + '</nav></div></header>';
  var body;
  if (S.loading || !S.db) body = S.err ? '<div class="wrap"><div class="card empty">' + esc(S.err) + '<div style="margin-top:12px"><button class="btn" data-act="reload">다시 시도</button></div></div></div>' : skeleton();
  else {
    var fn = { home: pHome, rules: pRules, tasks: pTasks, suggest: pSuggest, history: pHistory, docs: pDocs, settings: pSettings }[r.path] || pHome;
    if (r.path === 'settings' && !adminView()) fn = pHome;
    body = '<main class="wrap">' + fn(r.q) + '</main>';
  }
  var ft = '<footer class="ft"><div class="ft-in"><img src="' + window.HB_LOGO + '" alt=""><span>' + esc(S.db ? S.db.meta.company : '㈜한백건축사사무소') + ' · ' + esc(S.db ? S.db.meta.owner : '') + '</span>' +
    (S.db && S.db.meta.updatedAt ? '<span>최종 수정 ' + fmtDate(S.db.meta.updatedAt) + '</span>' : '') + '<span class="sp"></span>' +
    (S.isAdmin ? '' : '<button data-act="login">관리자</button>') + '</div></footer>';
  $app.innerHTML = hd + body + ft;
  afterRender(r);
}
function skeleton() {
  return '<main class="wrap"><div class="skel" style="height:180px"></div><div class="legend" style="margin-top:16px">' + [1, 2, 3, 4].map(function () { return '<div class="skel" style="height:110px"></div>'; }).join('') + '</div><div class="skel" style="height:260px;margin-top:16px"></div></main>';
}
function afterRender(r) {

  if (r.path === 'suggest' && S.sugs === null) loadSugs();

function renderGate() {

/* ----- 홈 ----- */

/* ----- 사내규정 ----- */
function visibleRules() { return (S.db.rules || []).filter(function (r) { return adminView() || r.public !== false; }); }
function matchQ(r, q) {
  if (!q) return true;
  var hay = (r.id + ' ' + r.title + ' ' + plain(r.current) + ' ' + (r.note || '') + ' ' + (r.tags || []).join(' ') + ' ' + catName(r.cat)).toLowerCase();
  return q.toLowerCase().split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
}

  function link(o) { var p = Object.assign({ cat: cat, status: status, q: query }, o); var s = []; for (var k in p) if (p[k] && p[k] !== 'all') s.push(k + '=' + encodeURIComponent(p[k])); return '#/rules' + (s.length ? '?' + s.join('&') : ''); }

  var h = '<div class="page-h"><div><h1>사내규정</h1><p>' + esc(db.meta.baseVersion) + ' · 개정 검토 중인 항목도 확정 전까지는 현행 기준이 적용됩니다.</p></div>' +
    (adminView() ? '<div class="row"><button class="btn pri" data-act="rule-new" data-cat="' + (cat === 'all' ? db.categories[0].id : cat) + '">' + ICON.plus + '항목 추가</button><button class="btn" data-act="cats-edit">분류 편집</button></div>' : '') + '</div>';
  h += '<div class="rules-l"><aside class="side" aria-label="분류"><div class="lbl">분류</div><a href="' + link({ cat: 'all' }) + '" class="' + (cat === 'all' ? 'on' : '') + '">전체<span class="n">' + all.length + '</span></a>';
  db.categories.forEach(function (c) { h += '<a href="' + link({ cat: c.id }) + '" class="' + (cat === c.id ? 'on' : '') + '">' + esc(c.name) + '<span class="n">' + all.filter(function (r) { return r.cat === c.id; }).length + '</span></a>'; });
  h += '</aside><div>';
  h += '<div class="toolbar"><form class="searchbox" data-form="rsearch">' + ICON.search + '<input name="q" value="' + esc(query) + '" placeholder="항목·내용 검색" aria-label="규정 검색"></form></div>';
  h += '<div class="row" style="margin:-4px 0 18px"><a class="chip ' + (status === 'all' ? 'on' : '') + '" href="' + link({ status: 'all' }) + '">전체 상태</a>';

      setToken(res.token); closeModal(); S.preview = false; toast('관리자로 로그인했습니다');
      S.settings = null; S.sugs = null;
      return load().then(function () { if (res.mustChange) go('#/settings'); });
    });
  };
}

/* ===== 이벤트 ===== */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  if (el.tagName === 'INPUT' && el.type === 'file') return;
  var db = S.db;
  switch (a) {
    case 'close': e.preventDefault(); closeModal(); break;
    case 'reload': S.err = ''; load(); break;
    case 'login': loginModal(); break;
    case 'logout': api('logout'); setToken(''); S.isAdmin = false; S.settings = null; S.sugs = null; toast('로그아웃했습니다'); load(); break;
    case 'preview': S.preview = !S.preview; render(); break;
    case 'rule-new': editRule(null, el.getAttribute('data-cat')); break;
    case 'rule-edit': editRule(id); break;
    case 'rule-del': if (confirm(id + ' 항목을 삭제할까요?')) { db.rules = db.rules.filter(function (x) { return x.id !== id; }); saveDb(id + ' 항목 삭제', true).then(function () { closeModal(); render(); }); } break;
    case 'cats-edit': editCats(); break;
    case 'task-toggle': S.openTask[id] = !S.openTask[id]; if (!S.openTask[id] && route().q.id === id) { history.replaceState(null, '', '#/tasks'); } render(); break;
    case 'task-new': editTask(null); break;
    case 'task-edit': editTask(id); break;
    case 'task-pub': var t = db.tasks.filter(function (x) { return x.id === id; })[0]; t.public = !t.public; saveDb('개선과제 ' + id + (t.public ? ' 직원 공개' : ' 비공개 전환'), t.public).then(render); break;
    case 'task-del': if (confirm(id + ' 과제를 삭제할까요?')) { db.tasks = db.tasks.filter(function (x) { return x.id !== id; }); saveDb('개선과제 ' + id + ' 삭제', false).then(function () { closeModal(); render(); }); } break;
    case 'doc-new': editDoc(null); break;
    case 'doc-edit': editDoc(id); break;
    case 'doc-del': if (confirm('문서를 삭제할까요?')) { db.docs = db.docs.filter(function (x) { return x.id !== id; }); saveDb('문서 삭제', false).then(function () { closeModal(); go('#/docs'); }); } break;
    case 'notice-new': editNotice(null); break;
    case 'notice-edit': editNotice(id); break;
    case 'notice-del': if (confirm('공지를 삭제할까요?')) { db.notices = db.notices.filter(function (x) { return x.id !== id; }); saveDb('공지 삭제', false).then(function () { closeModal(); render(); }); } break;
    case 'status-edit': editStatuses(); break;
    case 'unclamp': var b = el.previousElementSibling; if (b) b.classList.remove('clamp'); el.remove(); break;
    case 'like':
      var undo = !!S.liked[id];
      api('like', { id: id, undo: undo }).then(function (res) {
        if (!res.ok) return toast(res.error, true);
        if (undo) delete S.liked[id]; else S.liked[id] = 1; LS.set('hb_liked', S.liked);
        (S.sugs || []).concat(S.mineItems || []).forEach(function (s) { if (s.id === id) s.likes = res.likes; });
        render();
      });
      break;
    case 'sug-del': if (confirm('이 건의를 삭제할까요? 되돌릴 수 없습니다.')) api('deleteSuggestion', { id: id }).then(function (res) { if (!res.ok) return toast(res.error, true); S.sugs = S.sugs.filter(function (s) { return s.id !== id; }); toast('삭제했습니다'); render(); }); break;
    case 'export': downloadAll(); break;
    case 'export-csv': downloadCsv(); break;
    case 'restore': if (confirm('이 시점으로 되돌릴까요? 현재 상태는 자동 백업됩니다.')) api('restore', { id: id }).then(function (res) { if (!res.ok) return toast(res.error, true); toast('복원했습니다'); S.settings = null; load(); }); break;
    case 'reset-seed': var c = prompt('보고서 초기 데이터로 되돌립니다. 현재 상태는 자동 백업됩니다.\n계속하려면 RESET 을 입력하세요.'); if (c === 'RESET') api('resetSeed', { confirm: 'RESET' }).then(function (res) { if (!res.ok) return toast(res.error, true); toast('초기 데이터로 되돌렸습니다'); S.settings = null; load(); }); break;
  }
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-seg] button'); if (!b) return;
  var seg = b.parentElement, kind = seg.getAttribute('data-seg'), v = b.getAttribute('data-v');
  if (kind === 'vis') { seg.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); seg.parentElement.querySelector('input[name=visibility]').value = v; }
  if (kind === 'tab') { S.sugFilter.tab = v; render(); }
});
document.addEventListener('change', function (e) {
  var f = e.target.getAttribute && e.target.getAttribute('data-filter');
  if (f) { S.sugFilter[f] = e.target.value; render(); return; }
  if (e.target.matches('input[type=file][data-act=import]')) importJson(e.target.files[0]);
});
document.addEventListener('submit', function (e) {
  var form = e.target, kind = form.getAttribute('data-form'); if (!kind) return;
  e.preventDefault();
  var v = fd(form), btn = form.querySelector('button:not([type=button])');
  function busy(p) { if (btn) { btn.disabled = true; } return Promise.resolve(p).catch(function () {}).then(function () { if (btn) btn.disabled = false; }); }
  switch (kind) {
    case 'code': S.code = v.code.trim(); LS.set('hb_code', S.code); S.needCode = false; load(); break;
    case 'search': go('#/rules?q=' + encodeURIComponent(v.q.trim())); break;
    case 'rsearch': var r = route(); r.q.q = v.q.trim(); var s = []; for (var k in r.q) if (r.q[k] && r.q[k] !== 'all' && k !== 'id') s.push(k + '=' + encodeURIComponent(r.q[k])); go('#/rules' + (s.length ? '?' + s.join('&') : '')); break;
    case 'modal': if (S.modalSubmit) busy(S.modalSubmit(v)); break;
    case 'sug':
      busy(api('submit', { s: v }).then(function (res) {
        if (!res.ok) return toast(res.error, true);
        S.mine.push({ id: res.id, key: res.key }); LS.set('hb_mine', S.mine);
        S.lastReceipt = res.id; toast('건의를 등록했습니다'); S.sugs = null; loadSugs();
      }));
      break;
    case 'sug-adm':
      var sid = form.getAttribute('data-id');
      busy(api('updateSuggestion', { id: sid, patch: v }).then(function (res) {
        if (!res.ok) return toast(res.error, true);
        S.sugs = S.sugs.map(function (s) { return s.id === sid ? res.item : s; }); toast('저장했습니다'); render();
      }));
      break;
    case 'creds':
      busy(api('changeCreds', v).then(function (res) { if (!res.ok) return toast(res.error, true); toast('계정을 변경했습니다'); S.settings = null; loadSettings(); }));
      break;
    case 'viewcode':
      busy(api('setViewCode', { viewCode: v.viewCode }).then(function (res) { if (!res.ok) return toast(res.error, true); S.code = res.viewCode; LS.set('hb_code', S.code); toast(res.viewCode ? '열람 코드를 저장했습니다' : '열람 코드를 해제했습니다'); S.settings.viewCode = res.viewCode; }));
      break;
    case 'meta':
      Object.assign(S.db.meta, { siteTitle: v.siteTitle, baseVersion: v.baseVersion, company: v.company, owner: v.owner, intro: v.intro, suggestCats: split(v.suggestCats) });
      busy(saveDb('사이트 문구 수정', false).then(render));
      break;
  }
});

function dl(name, text, type) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function downloadAll() {
  api('exportAll').then(function (res) { if (!res.ok) return toast(res.error, true); dl('hanbaek_rules_' + today() + '.json', JSON.stringify(res, null, 1), 'application/json'); });
}
function downloadCsv() {
  var rows = [['ID', '분류', '항목', '상태', '현행 기준', '상태 안내', '관련 과제', '공개']];
  S.db.rules.forEach(function (r) { rows.push([r.id, catName(r.cat), r.title, st('rule', r.status).label, r.current, r.note, (r.related || []).join(' '), r.public === false ? 'N' : 'Y']); });
  var csv = '﻿' + rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return '"' + c.replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
  dl('hanbaek_rules_' + today() + '.csv', csv, 'text/csv');
}
function importJson(file) {
  if (!file) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var o = JSON.parse(rd.result); var db = o.db || o;
      if (!db.rules || !db.categories || !db.statuses) throw new Error('형식 오류');
      if (!confirm('규정 ' + db.rules.length + '개, 과제 ' + (db.tasks || []).length + '개를 가져와 현재 데이터를 대체할까요? (현재 상태는 자동 백업)')) return;
      db.meta = db.meta || {}; db.meta.updatedAt = S.db.meta.updatedAt;
      S.db = db; saveDb('JSON 가져오기로 전체 데이터 갱신', false).then(render);
    } catch (e) { toast('JSON 파일을 읽지 못했습니다', true); }
  };
  rd.readAsText(file);
}

/* ===== 시작 ===== */
document.title = '한백건축 사내규정';
load();
})();

</script>
